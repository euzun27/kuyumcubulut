name: Windows kurulumu

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y nsis
      - run: npm ci
      - run: npm run kurulum
      - uses: actions/upload-artifact@v4
        with:
          name: Dunyatek_Kuyumcu_Portal_Kurulum
          path: desktop/cikti/*.exe
          if-no-files-found: error

  windowsta-dene:
    needs: derle
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Dunyatek_Kuyumcu_Portal_Kurulum
      - name: Sessiz kurulum
        shell: pwsh
        run: |
          $setup = Get-ChildItem *.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          foreach ($p in 'C:\Dunyatek_Kuyumcu_Portal\Dunyatek_Kuyumcu_Portal.exe', 'C:\Dunyatek_Kuyumcu_Portal\DunyatekSunucu.exe', 'C:\Dunyatek_Kuyumcu_Portal\app\server.mjs', 'C:\Dunyatek_Kuyumcu_Portal\Kaldir.exe', 'C:\Dunyatek_Kuyumcu_Portal\app\static\kilavuz\Dunyatek_Kuyumcu_Portal_Kullanim_Kilavuzu.pdf', 'C:\DUNYATEK_BACKUP', "$env:PUBLIC\Desktop\Dunyatek_Kuyumcu_Portal.lnk") {
            if (-not (Test-Path $p)) { throw "eksik: $p" }
          }
      - name: Masaüstü simgesiyle başlat ve kullan
        shell: pwsh
        run: |
          Start-Process 'C:\Dunyatek_Kuyumcu_Portal\Dunyatek_Kuyumcu_Portal.exe'
          $ok = $false
          foreach ($i in 1..40) {
            try { Invoke-RestMethod http://127.0.0.1:47800/api/health | Out-Null; $ok = $true; break } catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $ok) { Get-Content C:\Dunyatek_Kuyumcu_Portal\Veri\sunucu.log -ErrorAction SilentlyContinue; throw 'sunucu açılmadı' }
          $s = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          $j = @{ 'Content-Type' = 'application/json; charset=utf-8' }
          Invoke-RestMethod http://127.0.0.1:47800/api/auth/register -Method Post -Headers $j -WebSession $s -Body (@{ name = 'Test'; email = 't@d.com'; password = 'gizli-parola' } | ConvertTo-Json) | Out-Null
          Invoke-RestMethod http://127.0.0.1:47800/api/auth/login -Method Post -Headers $j -WebSession $s -Body (@{ email = 't@d.com'; password = 'gizli-parola' } | ConvertTo-Json) | Out-Null
          $alis = Invoke-RestMethod http://127.0.0.1:47800/api/alis -Method Post -Headers $j -WebSession $s -Body (@{ tedarikci = 'T'; cinsi = 'BİLEZİK'; ayar = '22'; gram = '10'; milyem = '916' } | ConvertTo-Json)
          if ($alis.status -ne 'ok') { throw "alış kaydedilemedi: $($alis.message)" }
          $y = Invoke-RestMethod http://127.0.0.1:47800/api/backup -Method Post -WebSession $s
          $file = "C:\DUNYATEK_BACKUP\$($y.data.file).json"
          if (-not (Test-Path $file)) { Get-ChildItem C:\DUNYATEK_BACKUP; throw "yedek dosyası yok: $file" }
          $list = Invoke-RestMethod http://127.0.0.1:47800/api/yerel-yedekler -WebSession $s
          Write-Host "klasördeki yedekler: $($list.data.name -join ', ')"
          $ortam = Invoke-RestMethod http://127.0.0.1:47800/api/ortam -WebSession $s
          if ($ortam.data.yedek_klasoru -ne 'C:\DUNYATEK_BACKUP') { throw "yanlış yedek klasörü: $($ortam.data.yedek_klasoru)" }
          $l = Invoke-RestMethod http://127.0.0.1:47800/api/lisans
          Write-Host "lisans: $($l.data.mesaj) makine kodu: $($l.data.makine_kodu)"
          if ($l.data.durum -ne 'deneme' -or $l.data.makine_kodu -notmatch '^[0-9A-F]{4}(-[0-9A-F]{4}){3}$') { throw 'lisans durumu beklenmedik' }
          if (Select-String -Path C:\Dunyatek_Kuyumcu_Portal\Veri\sunucu.log -Pattern 'makine kimliği okunamadı' -Quiet) { throw 'makine kimliği okunamadı' }
          if (-not (Test-Path "$env:ProgramData\Dunyatek\kuyumcu-deneme.dat")) { throw 'deneme kaydı yazılmadı' }
          (Invoke-WebRequest http://127.0.0.1:47800/static/styles.css -UseBasicParsing).StatusCode
          Get-Content C:\Dunyatek_Kuyumcu_Portal\Veri\sunucu.log
      - name: Üzerine yeniden kur (güncelleme), kayıtlar kalmalı
        shell: pwsh
        run: |
          $setup = Get-ChildItem *.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          Start-Process 'C:\Dunyatek_Kuyumcu_Portal\Dunyatek_Kuyumcu_Portal.exe'
          foreach ($i in 1..40) { try { Invoke-RestMethod http://127.0.0.1:47800/api/health | Out-Null; break } catch { Start-Sleep -Milliseconds 500 } }
          $s = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          Invoke-RestMethod http://127.0.0.1:47800/api/auth/login -Method Post -Headers @{ 'Content-Type' = 'application/json; charset=utf-8' } -WebSession $s -Body (@{ email = 't@d.com'; password = 'gizli-parola' } | ConvertTo-Json) | Out-Null
          $alis = Invoke-RestMethod http://127.0.0.1:47800/api/alis -WebSession $s
          if (@($alis.data).Count -ne 1) { throw "güncellemeden sonra kayıt kayboldu: $(@($alis.data).Count)" }
      - name: Kaldır, veriler kalmalı
        shell: pwsh
        run: |
          Start-Process 'C:\Dunyatek_Kuyumcu_Portal\Kaldir.exe' -ArgumentList '/S', '_?=C:\Dunyatek_Kuyumcu_Portal' -Wait
          if (Test-Path 'C:\Dunyatek_Kuyumcu_Portal\DunyatekSunucu.exe') { throw 'program kaldırılmadı' }
          if (-not (Test-Path 'C:\Dunyatek_Kuyumcu_Portal\Veri\kuyumcu.sqlite')) { throw 'veri silinmiş' }
          if (-not (Get-ChildItem C:\DUNYATEK_BACKUP\*.json)) { throw 'yedekler silinmiş' }
